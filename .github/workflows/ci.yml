name: CI

# Roda de verdade a cada push/PR — grátis, repositório público, sem tocar em AWS.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (todos os módulos)
        run: mvn -B clean compile

      - name: Testes
        run: mvn -B test

