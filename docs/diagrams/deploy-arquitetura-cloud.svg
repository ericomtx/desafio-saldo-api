<svg width="680" height="570" viewBox="0 0 680 570" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>Arquitetura de deploy em cloud — rascunho (recriar em draw.io com ícones oficiais AWS)</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="570" fill="#ffffff"/>

  <!-- Autorizador -->
  <rect x="40" y="20" width="260" height="44" rx="8" fill="#6b7280"/>
  <text x="170" y="47" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Autorizador (externo)</text>

  <!-- Cliente -->
  <rect x="380" y="20" width="260" height="44" rx="8" fill="#6b7280"/>
  <text x="510" y="47" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Cliente</text>

  <line x1="170" y1="64" x2="170" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="64" x2="510" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SQS -->
  <rect x="40" y="120" width="260" height="56" rx="8" fill="#6d28d9"/>
  <text x="170" y="145" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">SQS — fila de transações</text>
  <text x="170" y="163" text-anchor="middle" fill="#e9d5ff" font-size="12">Até 2000 msg/s</text>

  <!-- API Gateway -->
  <rect x="380" y="120" width="260" height="56" rx="8" fill="#6b7280"/>
  <text x="510" y="145" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">API Gateway (HTTP API)</text>
  <text x="510" y="163" text-anchor="middle" fill="#e5e7eb" font-size="12">Throttling · 200 req/s</text>

  <!-- DLQ branch -->
  <line x1="300" y1="148" x2="335" y2="148" stroke="#666" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <rect x="335" y="130" width="45" height="36" rx="6" fill="#c2410c"/>
  <text x="357" y="152" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">DLQ</text>

  <!-- VPC Link -->
  <line x1="510" y1="176" x2="510" y2="222" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="205" text-anchor="middle" fill="#666" font-size="11">VPC Link</text>

  <!-- ALB -->
  <rect x="380" y="222" width="260" height="56" rx="8" fill="#1d4ed8"/>
  <text x="510" y="247" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">ALB (interno)</text>
  <text x="510" y="265" text-anchor="middle" fill="#bfdbfe" font-size="12">Sem IP público</text>

  <line x1="170" y1="176" x2="170" y2="322" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="278" x2="510" y2="322" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ECS Consumer -->
  <rect x="40" y="322" width="260" height="70" rx="8" fill="#6d28d9"/>
  <text x="170" y="345" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">ECS Fargate — consumidor</text>
  <text x="170" y="362" text-anchor="middle" fill="#e9d5ff" font-size="12">saldo-api-consumer</text>
  <text x="170" y="379" text-anchor="middle" fill="#e9d5ff" font-size="12">Auto-scale: 2-20 tasks, pela fila</text>

  <!-- ECS Web -->
  <rect x="380" y="322" width="260" height="70" rx="8" fill="#1d4ed8"/>
  <text x="510" y="345" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">ECS Fargate — API de saldo</text>
  <text x="510" y="362" text-anchor="middle" fill="#bfdbfe" font-size="12">saldo-api-web</text>
  <text x="510" y="379" text-anchor="middle" fill="#bfdbfe" font-size="12">Auto-scale: 2-10 tasks, por CPU 60%</text>

  <path d="M170 392 L280 470" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M510 392 L400 470" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DynamoDB -->
  <rect x="210" y="470" width="260" height="56" rx="8" fill="#0f766e"/>
  <text x="340" y="495" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">DynamoDB</text>
  <text x="340" y="513" text-anchor="middle" fill="#99f6e4" font-size="12">saldos + transacoes-processadas</text>

  <text x="340" y="555" text-anchor="middle" fill="#999" font-size="11" font-style="italic">Rascunho — recriar em draw.io com ícones oficiais AWS antes de submeter</text>
</svg>
