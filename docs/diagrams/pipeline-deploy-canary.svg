<svg width="680" height="626" viewBox="0 0 680 626" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>Pipeline de deploy com estratégia canary — rascunho</title>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="626" fill="#ffffff"/>

  <rect x="250" y="20" width="180" height="44" rx="8" fill="#6b7280"/>
  <text x="340" y="47" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Commit / PR</text>

  <line x1="340" y1="64" x2="340" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="250" y="120" width="180" height="44" rx="8" fill="#6b7280"/>
  <text x="340" y="147" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Build &amp; testes</text>

  <line x1="340" y1="164" x2="340" y2="220" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="250" y="220" width="180" height="44" rx="8" fill="#6b7280"/>
  <text x="340" y="247" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Push imagem ECR</text>
  <text x="340" y="288" text-anchor="middle" fill="#999" font-size="11">Uma vez por app: saldo-api-web e saldo-api-consumer</text>

  <line x1="340" y1="264" x2="340" y2="320" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="220" y="320" width="240" height="56" rx="8" fill="#1d4ed8"/>
  <text x="340" y="343" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Deploy Canary</text>
  <text x="340" y="361" text-anchor="middle" fill="#bfdbfe" font-size="12">10% do tráfego real</text>

  <line x1="340" y1="376" x2="340" y2="430" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="220" y="430" width="240" height="56" rx="8" fill="#b45309"/>
  <text x="340" y="453" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Monitorar métricas</text>
  <text x="340" y="471" text-anchor="middle" fill="#fde68a" font-size="12">Alarmes CloudWatch</text>

  <path d="M280 486 L220 540" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M400 486 L460 540" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="110" y="540" width="220" height="56" rx="8" fill="#c2410c"/>
  <text x="220" y="563" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Rollback automático</text>
  <text x="220" y="581" text-anchor="middle" fill="#fed7aa" font-size="12">Alarme disparou</text>

  <rect x="350" y="540" width="220" height="56" rx="8" fill="#0f766e"/>
  <text x="460" y="563" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Promove p/ 100%</text>
  <text x="460" y="581" text-anchor="middle" fill="#99f6e4" font-size="12">Métricas normais</text>

  <text x="340" y="618" text-anchor="middle" fill="#999" font-size="11" font-style="italic">Rascunho — mesmo fluxo roda independentemente para cada uma das duas aplicações</text>
</svg>
